name: Sync Kadmoo Brain

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Kadmoo Brain sync
        env:
          SYNC_URL: ${{ secrets.KADMOO_BRAIN_SYNC_URL }}
          SYNC_SECRET: ${{ secrets.BRAIN_SYNC_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_URL:-}" ]; then
            echo "::error::Missing repository secret KADMOO_BRAIN_SYNC_URL"
            exit 1
          fi
          if [ -z "${SYNC_SECRET:-}" ]; then
            echo "::error::Missing repository secret BRAIN_SYNC_SECRET"
            exit 1
          fi
          echo "SYNC_URL host check (no secret printed):"
          echo "$SYNC_URL" | sed -E 's#https?://([^/]+)/.*#\1#'
          echo "Secret length: ${#SYNC_SECRET}"

          HTTP_CODE=$(curl -sS -o /tmp/brain-sync.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SYNC_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${GITHUB_SHA}\",\"repo\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\"}" \
            "${SYNC_URL}")

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/brain-sync.json || true
          echo

          case "${HTTP_CODE}" in
            200|207)
              echo "Brain sync accepted"
              ;;
            401)
              echo "::error::Unauthorized — BRAIN_SYNC_SECRET in GitHub must match Vercel exactly"
              exit 1
              ;;
            503)
              echo "::error::App says BRAIN_SYNC_SECRET is not configured on Vercel"
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP ${HTTP_CODE}"
              exit 1
              ;;
          esac
