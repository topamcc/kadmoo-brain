name: Sync Kadmoo Brain

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: brain-sync
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint vault
        run: node scripts/lint-vault.mjs

  sync:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Trigger Kadmoo Brain sync
        env:
          SYNC_URL: ${{ secrets.KADMOO_BRAIN_SYNC_URL }}
          SYNC_SECRET: ${{ secrets.BRAIN_SYNC_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_URL:-}" ]; then
            echo "::error::Missing repository secret KADMOO_BRAIN_SYNC_URL"
            exit 1
          fi
          if [ -z "${SYNC_SECRET:-}" ]; then
            echo "::error::Missing repository secret BRAIN_SYNC_SECRET"
            exit 1
          fi

          # Normalize common mistakes (host-only / missing scheme)
          case "${SYNC_URL}" in
            http://*|https://*) ;;
            *)
              echo "SYNC_URL missing scheme — prepending https://"
              SYNC_URL="https://${SYNC_URL}"
              ;;
          esac
          # If only a host was pasted, append the API path
          if [[ "${SYNC_URL}" != *"/api/agent/brain/sync"* ]]; then
            SYNC_URL="${SYNC_URL%/}/api/agent/brain/sync"
            echo "Appended /api/agent/brain/sync to SYNC_URL"
          fi

          echo "Using SYNC_URL: ${SYNC_URL}"
          echo "Secret length: ${#SYNC_SECRET}"

          HTTP_CODE=$(curl -sS -o /tmp/brain-sync.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SYNC_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${GITHUB_SHA}\",\"repo\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\"}" \
            "${SYNC_URL}")

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/brain-sync.json || true
          echo

          case "${HTTP_CODE}" in
            200|207)
              echo "Brain sync accepted"
              ;;
            401)
              echo "::error::Unauthorized — BRAIN_SYNC_SECRET in GitHub must match Vercel exactly"
              exit 1
              ;;
            503)
              echo "::error::App says BRAIN_SYNC_SECRET is not configured on Vercel"
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP ${HTTP_CODE}"
              exit 1
              ;;
          esac
